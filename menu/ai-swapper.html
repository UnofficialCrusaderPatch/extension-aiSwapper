<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Swapper</title>
  </head>
  <body>
    <div class="ai-swapper" hidden>
      <div class="compact-slots" data-i18n-label="menu.slots"></div>
      <div class="compact-toolbar">
        <h2 class="compact-slot-title"></h2>
        <div class="compact-summary" data-i18n-label="menu.components"></div>
        <button
          class="compact-reset"
          data-i18n="menu.reset"
          data-i18n-title="menu.reset.hint"
        ></button>
      </div>
      <p class="compact-help" data-i18n="menu.help"></p>
      <div class="compact-scroll">
        <table class="compact-table">
          <tbody class="compact-cards"></tbody>
        </table>
      </div>
      <div class="compact-bottom">
        <label class="compact-search"
          ><input
            type="search"
            data-i18n-placeholder="menu.search"
            data-i18n-label="menu.search"
        /></label>
        <div
          class="sword-checkbox compact-toggle"
          data-i18n-title="menu.inuse.hint"
        >
          <input
            id="slot-active-filter"
            type="checkbox"
            class="compact-in-use"
          /><label for="slot-active-filter" data-i18n="menu.inuse"></label>
        </div>
        <span class="compact-count"></span
        ><label class="compact-language-label"
          ><span data-i18n="menu.language"></span>
          <select class="compact-language" data-i18n-label="menu.language">
            <option
              value=""
              data-i18n="language.default.default"
            ></option></select
        ></label>
      </div>
      <details class="compact-diagnostics" hidden>
        <summary></summary>
        <pre></pre>
        <button class="compact-retry" data-i18n="menu.retry"></button>
      </details>
    </div>
  </body>
</html>
